- name: swe_bench
  sandbox:
    provider: modal          # or docker; the sample row supplies the per-instance `image`
    runtime_timeout: 7200
  agent:
    name: react
    max_steps: 32
    tools:
      - name: stateful_shell
        command_timeout: 120
        env_vars:
          PAGER: "cat"
          GIT_PAGER: "cat"
          MANPAGER: "cat"
          TQDM_DISABLE: "1"
          PIP_PROGRESS_BAR: "off"
      - name: str_replace_editor
      - name: submit
    model:
      temperature: 1.0
      top_p: 1.0
      max_tokens_per_turn: 1024
      max_total_tokens: 7168


# Run-wide defaults for the arithmetic tool task (the smoke domain for the Trainium
# end-to-end run). Each sample's Task Config is deep-merged onto this entry, so a row
# only needs {name, prompt, metadata}.
#
# `local` sandbox: the calculator and finish tools are pure host-side functions, so no
# container is provisioned. max_steps=3 bounds an episode at calculator -> finish (+1
# slack).
#
# The two token budgets are NOT the same kind of number. max_tokens_per_turn is generation
# only, and mini-verl shapes every compiled decode graph to it. max_total_tokens is the whole
# CONTEXT (prompt + generation, re-measured each turn), so it has to leave room for the system
# prompt with the rendered tool schemas -- ~340 tokens on Qwen2.5 -- plus every turn and tool
# observation appended after it. It must also stay within the training frame minus one turn
# (max_prompt_length + max_response_length - max_tokens_per_turn); AgenticRollout checks this.
- name: arithmetic
  calculator_reward: 0.2
  sandbox:
    provider: local
  agent:
    name: react
    max_steps: 3
    tools:
      - name: calculator
      - name: finish
    model:
      temperature: 1.0
      top_p: 1.0
      max_tokens_per_turn: 96
      max_total_tokens: 768
